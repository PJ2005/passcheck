<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassCheck FIU - Reconciliation Engine Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn.primary:hover {
            background: #2563eb;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        main {
            padding: 3rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .metric-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
        }

        .metric-card.success::before { background: var(--success); }
        .metric-card.warning::before { background: var(--warning); }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6);
        }

        .metric-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .currency {
            font-size: 1.5rem;
            color: var(--text-muted);
        }
        
        .value-number {
            transition: color 0.3s;
        }

        .metric-card.success .metric-value { color: var(--success); }
        .metric-card.warning .metric-value { color: var(--warning); }

        .table-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .table-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1.25rem 2rem;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-variant-numeric: tabular-nums;
        }

        tbody tr {
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        
        .utr {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            color: #a78bfa;
        }
        
        .amount {
            font-weight: 600;
        }
        
        .row-leave {
            animation: slideOutRight 0.5s forwards ease-in-out;
        }
        
        .row-enter {
            animation: slideInLeft 0.5s forwards ease-in-out;
        }

        @keyframes slideOutRight {
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px var(--accent-glow); }
            50% { box-shadow: 0 0 30px var(--accent-glow); }
            100% { box-shadow: 0 0 15px var(--accent-glow); }
        }

        .loader {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            padding: 4rem;
            text-align: center;
            color: var(--text-muted);
        }

        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .toast {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideInUp 0.3s forwards, fadeOut 0.3s forwards 4.7s;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--error); }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }

    </style>
</head>
<body>
    <header>
        <h1>PassCheck FIU</h1>
        <div class="actions">
            <button class="btn" id="btn-seed" onclick="seedData()">
                <span class="loader" id="loader-seed"></span>
                Seed Mock Data
            </button>
            <button class="btn primary" id="btn-reconcile" onclick="runReconciliation()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
                <span class="loader" id="loader-reconcile"></span>
                Run Engine
            </button>
        </div>
    </header>

    <main>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Expected Vendor Funds</div>
                <div class="metric-value">
                    <span class="currency">₹</span>
                    <span class="value-number" id="val-expected">0.00</span>
                </div>
            </div>
            <div class="metric-card success">
                <div class="metric-title">Verified in Bank (Matched)</div>
                <div class="metric-value">
                    <span class="currency">₹</span>
                    <span class="value-number" id="val-settled">0.00</span>
                </div>
            </div>
            <div class="metric-card warning">
                <div class="metric-title">Missing Funds (Pending)</div>
                <div class="metric-value">
                    <span class="currency">₹</span>
                    <span class="value-number" id="val-pending">0.00</span>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Pending Transactions</h2>
                <div class="badge" id="pending-count">0 UNMATCHED</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Vendor Txn ID</th>
                        <th>UTR Number</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="4">
                            <div class="empty-state">
                                No pending transactions found. Click "Seed Mock Data" to begin.
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

    <script>
        let merchantId = "";
        let providerId = "";
        let currentPendingIds = new Set();

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        };

        const animateValue = (obj, start, end, duration) => {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const current = progress * (end - start) + start;
                obj.innerHTML = formatCurrency(current);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = formatCurrency(end);
                }
            };
            window.requestAnimationFrame(step);
        };

        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    ${type === 'success' 
                        ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'
                        : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'
                    }
                </svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 5000);
        };

        const fetchConfig = async () => {
            try {
                const res = await fetch('/api/v1/demo/config');
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                merchantId = data.merchant_id;
                providerId = data.provider_id;
                await refreshDashboard();
            } catch (err) {
                showToast("Failed to load config: " + err.message, "error");
            }
        };

        const refreshDashboard = async (animateNumbers = false, isRecon = false) => {
            try {
                const res = await fetch(`/api/v1/demo/dashboard/${merchantId}`);
                const data = await res.json();

                const expEl = document.getElementById('val-expected');
                const setEl = document.getElementById('val-settled');
                const penEl = document.getElementById('val-pending');

                if (animateNumbers) {
                    const parseVal = (el) => parseFloat(el.innerText.replace(/,/g, ''));
                    animateValue(expEl, parseVal(expEl), data.total_expected_funds, 1000);
                    animateValue(setEl, parseVal(setEl), data.total_settled_funds, 1000);
                    animateValue(penEl, parseVal(penEl), data.total_pending_funds, 1000);
                } else {
                    expEl.innerHTML = formatCurrency(data.total_expected_funds);
                    setEl.innerHTML = formatCurrency(data.total_settled_funds);
                    penEl.innerHTML = formatCurrency(data.total_pending_funds);
                }

                document.getElementById('pending-count').innerText = `${data.pending_transactions.length} UNMATCHED`;

                const tbody = document.getElementById('table-body');
                const newIds = new Set(data.pending_transactions.map(t => t.vendor_txn_id));

                if (data.pending_transactions.length === 0) {
                    if (isRecon) {
                        // Animate all leaving
                        Array.from(tbody.children).forEach(row => {
                            row.classList.add('row-leave');
                        });
                        setTimeout(() => {
                            tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">All transactions matched successfully!</div></td></tr>`;
                        }, 500);
                    } else {
                        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">No pending transactions found. Click "Seed Mock Data" to begin.</div></td></tr>`;
                    }
                    currentPendingIds = newIds;
                    return;
                }

                let html = '';
                data.pending_transactions.forEach(txn => {
                    const isNew = !currentPendingIds.has(txn.vendor_txn_id) && !isRecon;
                    html += `
                        <tr id="row-${txn.vendor_txn_id}" class="${isNew ? 'row-enter' : ''}">
                            <td>${txn.date}</td>
                            <td>${txn.vendor_txn_id}</td>
                            <td><span class="utr">${txn.utr_number}</span></td>
                            <td class="amount">₹${formatCurrency(txn.amount)}</td>
                        </tr>
                    `;
                });

                if (isRecon) {
                    // Find rows that are no longer pending and animate them out
                    currentPendingIds.forEach(id => {
                        if (!newIds.has(id)) {
                            const row = document.getElementById(`row-${id}`);
                            if (row) {
                                row.classList.add('row-leave');
                                setTimeout(() => row.remove(), 500);
                            }
                        }
                    });
                    
                    // After animations, fully re-render just to be safe
                    setTimeout(() => { tbody.innerHTML = html; }, 500);
                } else {
                    tbody.innerHTML = html;
                }

                currentPendingIds = newIds;
            } catch (err) {
                console.error("Dashboard refresh error:", err);
            }
        };

        const seedData = async () => {
            if (!merchantId) return showToast("Config not loaded yet", "error");
            
            const btn = document.getElementById('btn-seed');
            const loader = document.getElementById('loader-seed');
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.7';
            loader.style.display = 'inline-block';

            try {
                const res = await fetch('/api/v1/demo/seed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ merchant_id: merchantId, provider_id: providerId })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast(data.message);
                    await refreshDashboard(true, false);
                } else {
                    throw new Error(data.error || "Seeding failed");
                }
            } catch (err) {
                showToast(err.message, "error");
            } finally {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
                loader.style.display = 'none';
            }
        };

        const runReconciliation = async () => {
            if (!merchantId) return showToast("Config not loaded yet", "error");
            
            const btn = document.getElementById('btn-reconcile');
            const loader = document.getElementById('loader-reconcile');
            btn.style.animation = 'pulseGlow 1s infinite';
            btn.style.pointerEvents = 'none';
            loader.style.display = 'inline-block';

            try {
                const res = await fetch('/api/v1/reconcile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ merchant_id: merchantId })
                });
                const data = await res.json();
                
                if (res.ok) {
                    showToast(`Reconciliation complete! Matched ${data.matches_found} transactions.`);
                    await refreshDashboard(true, true);
                } else {
                    throw new Error(data.error || "Engine failed");
                }
            } catch (err) {
                showToast(err.message, "error");
            } finally {
                btn.style.animation = '';
                btn.style.pointerEvents = 'auto';
                loader.style.display = 'none';
            }
        };

        // Initialize
        window.addEventListener('DOMContentLoaded', fetchConfig);
    </script>
</body>
</html>
